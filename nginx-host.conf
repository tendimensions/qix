# Host-level nginx configuration for qix.tendimensions.com
#
# Installed at: /etc/nginx/sites-available/qix.tendimensions.com
# Symlinked to: /etc/nginx/sites-enabled/qix.tendimensions.com
#
# Runs on the Linode host (outside Docker) and routes the subdomain to the
# qix-web container bound on localhost. Cloudflare real-IP restoration is
# already configured globally by the tendimensions.com site file.
#
# NOTE: uses the default "combined" log format, not td_detailed — sites-enabled
# files load alphabetically and this file loads before tendimensions.com, where
# td_detailed is defined.

server {
    listen 80;
    server_name qix.tendimensions.com;

    access_log /var/log/nginx/qix-access.log;
    error_log  /var/log/nginx/qix-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
