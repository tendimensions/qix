services:
  qix:
    build: .
    image: qix-web:latest
    container_name: qix-web
    ports:
      # Bound to localhost only — host nginx proxies qix.tendimensions.com → here
      - "127.0.0.1:8091:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
