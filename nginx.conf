# Container-level nginx config for the Qix game (static files only)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    # Audio files are large and change rarely; let browsers cache them
    location ~* \.mp3$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
